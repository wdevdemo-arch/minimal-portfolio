version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Bratislava"
    open-pull-requests-limit: 5
    groups:
      nextjs:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Bratislava"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
      include: "scope"
